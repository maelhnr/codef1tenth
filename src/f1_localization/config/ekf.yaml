ekf_filter_node:
  ros__parameters:
    # Fréquence de calcul (en Hz)
    frequency: 30.0

    # On travaille en 2D (on ignore l'altitude Z, le roulis et le tangage)
    two_d_mode: true

    # Si vrai, publie la transformation entre 'odom' et 'base_link'
    publish_tf: true

    # Noms des repères (frames)
    map_frame: map              # Repère fixe du monde
    odom_frame: odom            # Repère de départ de la voiture
    base_link_frame: base_link  # Repère physique de la voiture
    world_frame: odom           # On fusionne par rapport à l'odométrie

    # --- SOURCE 1 : ODOMÉTRIE (Simulateur ou roues) ---
    odom0: /odom
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0_config: [true,  true,  false, 
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_relative: false

    # --- SOURCE 2 : IMU (Caméra RealSense) ---
    imu0: /camera/imu
    # On prend principalement l'orientation (yaw), la vitesse angulaire et l'accélération
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  true,  true,  false]
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true